<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>GURPS 4e - Stat Calculator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/table.css">

<!--====================            STYLING DELLA TABELLA            ============================-->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .questa-pagina {
            font-size: 25px !important;   /* <-- cambia qui la dimensione base */
            transform-origin: center center;
            will-change: transform;
        }

        #attributes-table,
        #derived-table {
            border-collapse: collapse;
            table-layout: fixed;
            width: auto;
        }

        #attributes-table th,
        #attributes-table td,
        #derived-table th,
        #derived-table td {
            padding: 2px 6px;
            font-size: 1em;
            line-height: 1.2;
        }

        #attributes-table input[type="number"],
        #points-header input[type="number"] {
            width: 2.5em;
            box-sizing: border-box;
            font-size: inherit;
            padding: 1px 2px;
        }
    </style>

<!--====================            STYLING DELLA TABELLA    (FINE)        ============================-->


<!--Qua vanno i link per i Css ✨✨✨✨✨✨✨✨✨✨-->
<link rel="stylesheet" href="../../../docs/css/baseStyle-CODE.css">
<link rel="stylesheet" href="../../../docs/css/outlineStyle-CODE.css">
<link rel="stylesheet" href="../../../docs/css/detailsStyle-CODE.css">
<link rel="stylesheet" href="../../../docs/css/tablesStyle-CODE.css">

    
</head>
<body>

<div class="questa-pagina">

    <a href="../../../index.html" style="
            display: inline-block; 
            color: inherit; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 1.05em;
            border: 1px solid #1f8a4c; 
            border-radius: 4px; 
            padding: 0.4em 0.8em;
            margin-left: 200px">
        ▶ HomePage ◀
    </a>

    <h1><u>Calcolatore Statistiche</u></h1>

    <div id="points-header">
        <div id="points-total-wrapper">
            <span class="section-title">Punti Totali</span>
            <input type="number" id="total-points" value="100">
        </div>
        <div id="points-remaining-wrapper">
            <span class="section-title">Punti Rimanenti</span>
            <div id="points-remaining">100</div>
        </div>
    </div>

    <h2><u>Statistiche Primarie</u></h2>

    <table id="attributes-table">
        <thead>
            <tr>
                <th>Stat</th>
                <th>Valore</th>
                <th>Spesa</th>
                <th>Costo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>ST</strong></td>
                <td><input type="number" id="st-value" value="10"></td>
                <td><span id="st-spesa">0</span></td>
                <td><input type="number" id="st-costo" value="10"></td>
            </tr>
            <tr>
                <td><strong>DX</strong></td>
                <td><input type="number" id="dx-value" value="10"></td>
                <td><span id="dx-spesa">0</span></td>
                <td><input type="number" id="dx-costo" value="20"></td>
            </tr>
            <tr>
                <td><strong>IQ</strong></td>
                <td><input type="number" id="iq-value" value="10"></td>
                <td><span id="iq-spesa">0</span></td>
                <td><input type="number" id="iq-costo" value="20"></td>
            </tr>
            <tr>
                <td><strong>HT</strong></td>
                <td><input type="number" id="ht-value" value="10"></td>
                <td><span id="ht-spesa">0</span></td>
                <td><input type="number" id="ht-costo" value="10"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:right"><strong>Spesa Totale:</strong></td>
                <td colspan="2"><strong id="total-attributi">0</strong> punti</td>
            </tr>
        </tbody>
    </table>

    <h2 class="section-title" style="margin-bottom: 20px; margin-top:20px;"><u>Statistiche Derivate</u></h2>
    <table id="derived-table">
        <thead>
            <tr>
                <th>Statistica</th>
                <th>Valore</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>HP</strong></td>
                <td id="hp"></td>
            </tr>
            <tr>
                <td><strong>Basic Lift</strong></td>
                <td id="bl"></td>
            </tr>
            <tr>
                <td><strong>Dmg (Thr/Sw)</strong></td>
                <td id="dmg"></td>
            </tr>
            <tr>
                <td><strong>FP</strong></td>
                <td id="fp"></td>
            </tr>
            <tr>
                <td><strong>Will</strong></td>
                <td id="will"></td>
            </tr>
            <tr>
                <td><strong>Basic Speed</strong></td>
                <td id="basic-speed"></td>
            </tr>
            <tr>
                <td><strong>Basic Move</strong></td>
                <td id="basic-move"></td>
            </tr>
            <tr>
                <td><strong>Dodge</strong></td>
                <td id="dodge"></td>
            </tr>
        </tbody>
    </table>

</div>

<script src="../../../docs/java/autoscale.js"></script>

</body>
</html>
